name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package-consumer:
    name: Installed package consumer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure release library
        run: cmake --preset release
      - name: Build and install library
        run: |
          cmake --build --preset release --parallel
          cmake --install build/release --prefix "$RUNNER_TEMP/chronex-install"
      - name: Configure downstream consumer
        run: cmake -S tests/consumer -B build/package-consumer -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/chronex-install"
      - name: Build downstream consumer
        run: cmake --build build/package-consumer --parallel
      - name: Run downstream consumer
        run: ctest --test-dir build/package-consumer --output-on-failure

  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 / GCC / Debug
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            preset: debug
          - name: Ubuntu 24.04 / GCC / Release
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            preset: release
          - name: Ubuntu 24.04 / Clang / Debug
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            preset: debug
          - name: Ubuntu 24.04 / Clang / Release
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            preset: release
          - name: macOS 15 / Apple Clang / Debug
            os: macos-15
            cc: clang
            cxx: clang++
            preset: debug
          - name: macOS 15 / Apple Clang / Release
            os: macos-15
            cc: clang
            cxx: clang++
            preset: release
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  formatting:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check C++ formatting
        run: |
          files=$(find include src tests benchmarks -type f \( -name '*.cc' -o -name '*.cpp' -o -name '*.hpp' \) 2>/dev/null || true)
          test -z "$files" || clang-format --dry-run --Werror $files

  sanitizers:
    name: Address and Undefined Behavior Sanitizers
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset sanitizers
      - name: Build
        run: cmake --build --preset sanitizers --parallel
      - name: Test
        run: ctest --test-dir build/sanitizers --output-on-failure

  thread-sanitizer:
    name: Thread Sanitizer
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset thread-sanitizer
      - name: Build
        run: cmake --build --preset thread-sanitizer --parallel
      - name: Test
        run: ctest --test-dir build/thread-sanitizer --output-on-failure
